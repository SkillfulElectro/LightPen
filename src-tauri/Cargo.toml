[package]
name = "lightpen"
version = "0.1.2"
description = "Write on PDFs in the air"
authors = ["ElectroMutex"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/SkillfulElectro/LightPen"
readme = "README.md"

[lib]
name = "lightpen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.12", features = [] }

[dependencies]
# >= 2.12 is load-bearing, not freshness: `Builder::on_permission_request`
# (used in lib.rs to grant the camera on Linux/WebKitGTK) was added in
# Tauri 2.12. A bare "2" would let a pinned/old resolution compile-fail —
# or, worse, tempt removing the handler to make it build.
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by `tauri dev`/`tauri build --debug`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
