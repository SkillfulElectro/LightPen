name: release

# Manual, tag-driven multi-platform release.
# Everything (desktop matrix, Android, iOS, checksums) is uploaded to the
# GitHub Release for the tag you provide. Nothing is published automatically.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.0.0 (must match ^v?[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.-]+)?$)"
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Keep the release as a draft (false publishes it after verification)'
        required: false
        default: true
        type: boolean
      build_android:
        description: 'Build Android (.apk/.aab). Requires Android secrets for signing.'
        required: false
        default: true
        type: boolean
      build_ios:
        description: 'Build iOS (.ipa). Requires Apple signing secrets.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One release pipeline per tag; never cancel a partially published release.
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  # Must match `channel` in rust-toolchain.toml; src/core/ciEnv.test.ts enforces
  # it. dtolnay/rust-toolchain has no default for this input, so a pinned action
  # reference must pass it explicitly.
  RUST_TOOLCHAIN: '1.82.0'

jobs:
  # ---------------------------------------------------------------- prepare --
  prepare:
    name: Validate tag and create release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate tag format
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release_tag '$TAG'. Expected something like v1.0.0 or 1.2.3-rc.1."
            exit 1
          fi
          echo "Tag '$TAG' is valid."

      - name: Check tag matches the app version
        id: version
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          echo "package.json version: $VERSION | tag version: $TAG_VERSION"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '$VERSION'. Bump the version first (see docs/RELEASING.md)."
            exit 1
          fi
          node scripts/check-versions.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
            ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          else
            echo "Creating a draft release for $TAG."
            DRAFT_FLAG="--draft"
            [[ "$DRAFT" == "false" ]] && DRAFT_FLAG=""
            PRE_FLAG=""
            [[ "$PRERELEASE" == "true" ]] && PRE_FLAG="--prerelease"
            # shellcheck disable=SC2086
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "LightPen $TAG" \
              --notes "Multi-platform build $TAG with hand-tracking, annotations and PDF export." \
              $DRAFT_FLAG $PRE_FLAG
            ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY##*/}"
          echo "upload_url=https://uploads.github.com/repos/$OWNER/$NAME/releases/$ID/assets{?name,label}" >> "$GITHUB_OUTPUT"
          echo "Release id: $ID"

  # ------------------------------------------------------------- desktop ----
  build-desktop:
    name: Desktop ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: ''
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            args: '--target universal-apple-darwin'
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ANDROID: ${{ inputs.build_android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev rpm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci
      - name: Download hand-tracking model
        run: npm run fetch:model
      - name: Check versions are in sync
        run: npm run check:versions

      - name: Build bundles and upload to the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing — everything below is secret-driven and may be empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          releaseId: ${{ env.RELEASE_ID }}
          args: ${{ matrix.args }} --target ${{ matrix.target }}
          includeDebug: false

      - name: Normalise artifact names
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          [[ -d "$bundle_dir" ]] || bundle_dir="src-tauri/target/release/bundle"
          mkdir -p renamed
          ext_of() { case "$1" in *.tar.gz) echo "app.tar.gz";; *) echo "${1##*.}";; esac; }
          for f in $(find "$bundle_dir" -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) 2>/dev/null); do
            ext=$(ext_of "$f")
            cp "$f" "renamed/LightPen_${VERSION}_${{ matrix.name }}.${ext}"
          done
          ls -l renamed || true

      - name: Normalise artifact names (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (-not (Test-Path $bundleDir)) { $bundleDir = "src-tauri/target/release/bundle" }
          New-Item -ItemType Directory -Force -Path renamed | Out-Null
          Get-ChildItem -Path $bundleDir -Recurse -File -Include *.msi,*.exe |
            ForEach-Object { Copy-Item $_.FullName "renamed/LightPen_${env:VERSION}_${{ matrix.name }}.$($_.Extension.TrimStart('.'))" }
          Get-ChildItem renamed

      - name: Upload renamed artifacts
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" renamed/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload renamed artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # `env:` values are environment variables in PowerShell, so they must be
        # read as $env:TAG — a bare $TAG is an unset PS variable (empty string).
        run: |
          $files = Get-ChildItem -Path renamed -File | ForEach-Object { $_.FullName }
          if (-not $files) { throw "no artifacts were produced to upload" }
          gh release upload "$env:TAG" @files --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Job summary
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          {
            echo "### Desktop — ${{ matrix.name }}"
            echo ""
            if [[ -z "${APPLE_CERTIFICATE:-}${WINDOWS_CERTIFICATE:-}" ]]; then
              echo "⚠️ No code-signing certificate secret configured — this artifact is unsigned."
            else
              echo "✅ Signed / notarised where signing secrets were available."
            fi
            echo ""
            ls -l renamed 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- android ---
  build-android:
    name: Android
    needs: prepare
    if: inputs.build_android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=27.0.12077973
          yes | sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Download hand-tracking model
        run: npm run fetch:model

      - name: Configure Android signing (optional)
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEY_BASE64:-}" ]]; then
            echo "::warning::No Android keystore secret found — building an UNSIGNED (debug-key) APK."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android-keys"
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/android-keys/release.keystore"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/android-keys/release.keystore"
          } > android-keystore.properties
          echo "Android keystore configured."

      - name: Initialise Android project
        run: npm run tauri android init --ci

      - name: Build APK + AAB
        run: |
          set -euo pipefail
          npm run tauri android build -- --apk --aab
          mkdir -p dist-android
          VERSION=${{ needs.prepare.outputs.version }}
          find src-tauri/gen/android -name "*.apk" -exec cp {} "dist-android/LightPen_${VERSION}_android_universal.apk" \;
          find src-tauri/gen/android -name "*.aab" -exec cp {} "dist-android/LightPen_${VERSION}_android_universal.aab" \;
          ls -l dist-android

      - name: Upload Android artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist-android/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        run: |
          {
            echo "### Android"
            echo ""
            if [[ "$HAS_ANDROID_KEYSTORE" == "true" ]]; then
              echo "✅ Signed with the configured keystore."
            else
              echo "⚠️ **Unsigned build** — no \`ANDROID_KEY_BASE64\` secret. Installable for testing only."
            fi
            echo ""
            ls -l dist-android 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ ios ---
  build-ios:
    name: iOS
    needs: prepare
    if: inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_IOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: npm ci
      - name: Download hand-tracking model
        run: npm run fetch:model

      - name: Import Apple signing certificate (optional)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Write App Store Connect API key (optional)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Initialise iOS project
        run: npm run tauri ios init --ci

      - name: Build iOS
        env:
          APPLE_TEAM_ID: ${{ env.HAS_IOS_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ "$HAS_IOS_SIGNING" == "true" ]]; then
            npm run tauri ios build -- --export-method app-store-connect
          else
            echo "::warning::No Apple signing secrets — building an UNSIGNED iOS app/archive."
            npm run tauri ios build -- --no-sign
          fi
          mkdir -p dist-ios
          VERSION=${{ needs.prepare.outputs.version }}
          find src-tauri/gen/apple -name "*.ipa" -exec cp {} "dist-ios/LightPen_${VERSION}_ios_arm64.ipa" \; || true
          find src-tauri/gen/apple -name "*.app" -maxdepth 6 | head -1 | xargs -r -I{} tar -czf "dist-ios/LightPen_${VERSION}_ios_arm64.app.tar.gz" -C "$(dirname {})" "$(basename {})"
          ls -l dist-ios

      - name: Upload iOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist-ios/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        run: |
          {
            echo "### iOS"
            echo ""
            if [[ "$HAS_IOS_SIGNING" == "true" ]]; then
              echo "✅ Signed .ipa built."
            else
              echo "⚠️ **Unsigned build** — no Apple signing secrets. Not installable on devices; testing only."
            fi
            echo ""
            ls -l dist-ios 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- verify ---
  verify:
    name: Verify assets and checksums
    needs: [prepare, build-desktop, build-android, build-ios]
    # Run even when a platform job failed, so the summary explains what is missing.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Collect release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_IOS: ${{ inputs.build_ios }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt

          expected=(
            "LightPen_${VERSION}_windows-x64"
            "LightPen_${VERSION}_windows-arm64"
            "LightPen_${VERSION}_macos-universal"
            "LightPen_${VERSION}_linux-x64"
          )
          [[ "$BUILD_ANDROID" == "true" ]] && expected+=("LightPen_${VERSION}_android_universal")
          [[ "$BUILD_IOS" == "true" ]] && expected+=("LightPen_${VERSION}_ios_arm64")

          missing=()
          for want in "${expected[@]}"; do
            if ! grep -q -- "$want" assets.txt; then missing+=("$want"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing expected artifacts: ${missing[*]}"
            {
              echo "## Release verification FAILED"
              echo ""
              echo "Missing: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All expected artifacts are present."

      - name: Generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern "*" --clobber
          cd release-assets
          rm -f SHA256SUMS.txt
          files=$(ls -1 | grep -v '^SHA256SUMS.txt$' || true)
          if [[ -z "$files" ]]; then
            echo "::error::No assets to checksum."
            exit 1
          fi
          # shellcheck disable=SC2086
          sha256sum $files | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, (.size|tostring)] | @tsv' > listing.tsv || true
          {
            echo "## LightPen $TAG"
            echo ""
            echo "| Asset | Size (bytes) | Status |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r name size; do
              [[ -z "$name" ]] && continue
              echo "| \`$name\` | $size | ✅ uploaded |"
            done < listing.tsv
            echo ""
            echo "Build matrix: desktop (Windows x64/arm64, macOS universal, Linux x64), Android, iOS."
            echo "Platform job results: desktop=${{ needs.build-desktop.result }}, android=${{ needs.build-android.result }}, ios=${{ needs.build-ios.result }}."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- publish ---
  publish:
    name: Publish release
    needs: [prepare, build-desktop, verify]
    if: always() && inputs.draft == false && needs.verify.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          PRE_FLAG=""
          [[ "$PRERELEASE" == "true" ]] && PRE_FLAG="--prerelease"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest $PRE_FLAG
          echo "Published $TAG." >> "$GITHUB_STEP_SUMMARY"
