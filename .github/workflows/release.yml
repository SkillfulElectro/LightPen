name: release

# Manual, tag-driven multi-platform release.
# Everything (desktop matrix, Android, iOS, checksums) is uploaded to the
# GitHub Release for the tag you provide. Nothing is published automatically.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.0.0 (must match ^v?[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.-]+)?$)"
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Keep the release as a draft (false publishes it after verification)'
        required: false
        default: true
        type: boolean
      build_android:
        description: 'Build Android. Signs with ANDROID_KEY_* secrets when set, else a debug-signed test APK.'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS (.dmg/.app). Unset signing secrets produce an unsigned build.'
        required: false
        default: false
        type: boolean
      build_ios:
        description: 'Build iOS (.ipa). Requires Apple signing secrets.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One release pipeline per tag; never cancel a partially published release.
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  # Must match `channel` in rust-toolchain.toml; src/core/ciEnv.test.ts enforces
  # it. dtolnay/rust-toolchain has no default for this input, so a pinned action
  # reference must pass it explicitly.
  RUST_TOOLCHAIN: '1.90.0'

jobs:
  # ---------------------------------------------------------------- prepare --
  prepare:
    name: Validate tag and create release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate tag format
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release_tag '$TAG'. Expected something like v1.0.0 or 1.2.3-rc.1."
            exit 1
          fi
          echo "Tag '$TAG' is valid."

      - name: Check tag matches the app version
        id: version
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          echo "package.json version: $VERSION | tag version: $TAG_VERSION"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '$VERSION'. Bump the version first (see docs/RELEASING.md)."
            exit 1
          fi
          node scripts/check-versions.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
            ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          else
            echo "Creating a draft release for $TAG."
            DRAFT_FLAG="--draft"
            [[ "$DRAFT" == "false" ]] && DRAFT_FLAG=""
            PRE_FLAG=""
            [[ "$PRERELEASE" == "true" ]] && PRE_FLAG="--prerelease"
            # shellcheck disable=SC2086
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "LightPen $TAG" \
              --notes "Multi-platform build $TAG with hand-tracking, annotations and PDF export." \
              $DRAFT_FLAG $PRE_FLAG
            ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY##*/}"
          echo "upload_url=https://uploads.github.com/repos/$OWNER/$NAME/releases/$ID/assets{?name,label}" >> "$GITHUB_OUTPUT"
          echo "Release id: $ID"

  # ------------------------------------------------------------- desktop ----
  build-desktop:
    name: Desktop ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `include:` cannot exclude rows, and expressions have no string
        # concatenation operator, so the JSON is assembled with format().
        # macOS is opt-in (build_macos): it is the only desktop target that needs
        # an Apple Developer certificate, and an unsigned .dmg is Gatekeeper-blocked.
        include: >-
          ${{
            fromJSON(
              format('[{0}{1}{2}]',
                '{"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","args":""},',
                inputs.build_macos && '{"name":"macos-universal","os":"macos-latest","target":"universal-apple-darwin","args":""},' || '',
                '{"name":"windows-arm64","os":"windows-latest","target":"aarch64-pc-windows-msvc","args":""},{"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","args":""}'
              )
            )
          }}
    # No RELEASE_ID here: the build steps must not upload, and `tauri-action`
    # would use it to publish the bundles under their default names as well.
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_ANDROID: ${{ inputs.build_android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev rpm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire gstreamer1.0-libav

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci
      - name: Download hand-tracking model
        run: npm run fetch:model
      - name: Check versions are in sync
        run: npm run check:versions

      - name: Prepare optional signing
        # Signing is entirely optional, and this step is the reason the macOS leg
        # used to fail without secrets: an *unset* repository secret is injected
        # as an EMPTY STRING, so `env: APPLE_CERTIFICATE: ${{ secrets.X }}` still
        # defines the variable. tauri checks `var_os(...).is_some()`, so it tried
        # to base64-decode "" and codesign with an empty certificate:
        #   SecKeychainItemImport: Unable to decode the provided data.
        # Export these only from here, and only when they hold a real value.
        shell: bash
        env:
          SECRET_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SECRET_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          SECRET_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SECRET_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_optional() {  # name, value
            if [[ -n "${2:-}" ]]; then
              printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
              echo "· $1 set"
            else
              echo "· $1 not configured (signing skipped for it)"
            fi
          }
          export_optional APPLE_CERTIFICATE "$SECRET_APPLE_CERT"
          export_optional APPLE_CERTIFICATE_PASSWORD "$SECRET_APPLE_CERT_PASSWORD"
          export_optional APPLE_SIGNING_IDENTITY "$SECRET_APPLE_IDENTITY"
          export_optional APPLE_ID "$SECRET_APPLE_ID"
          export_optional APPLE_PASSWORD "$SECRET_APPLE_PASSWORD"
          export_optional APPLE_TEAM_ID "$SECRET_APPLE_TEAM_ID"
          export_optional WINDOWS_CERTIFICATE "$SECRET_WINDOWS_CERT"
          export_optional WINDOWS_CERTIFICATE_PASSWORD "$SECRET_WINDOWS_CERT_PASSWORD"
          export_optional TAURI_SIGNING_PRIVATE_KEY "$SECRET_UPDATER_KEY"
          export_optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$SECRET_UPDATER_KEY_PASSWORD"

          # A certificate without its password cannot be imported — fail early
          # with a clear message instead of a pkcs12 error mid-bundle.
          if [[ -n "${SECRET_APPLE_CERT:-}" && -z "${SECRET_APPLE_CERT_PASSWORD:-}" ]]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_CERTIFICATE_PASSWORD is not."
            exit 1
          fi
          if [[ -n "${SECRET_WINDOWS_CERT:-}" && -z "${SECRET_WINDOWS_CERT_PASSWORD:-}" ]]; then
            echo "::error::WINDOWS_CERTIFICATE is set but WINDOWS_CERTIFICATE_PASSWORD is not."
            exit 1
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        # No secret is referenced here on purpose: `prepare optional signing` has
        # already exported the ones that are actually configured, and referencing
        # an unset secret would define an empty variable (see that step).
        #
        # Deliberately NO `releaseId`: the action would upload the bundles under
        # their default names (`LightPen_0.1.0_amd64.AppImage`, `-setup.exe`, …)
        # *and* we upload renamed copies below, so every artifact appeared twice
        # in the release. The action only builds now; the next steps publish.
        # The `--target` also means nothing here is a "plain binary" upload.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A single --target: the matrix already carries it (a universal macOS
          # build is expressed as the universal-apple-darwin pseudo-target).
          args: ${{ matrix.args }} --target ${{ matrix.target }}

      - name: AppImage ships the camera plugins
        if: matrix.name == 'linux-x64'
        shell: bash
        # `bundleMediaFramework` copies every plugin from the *build machine* into
        # the AppImage, so a runner without the capture plugins produces an app
        # whose WebKitGTK sees zero cameras ("no device was found amongst 0
        # devices"). Fail here rather than ship that.
        run: |
          set -euo pipefail
          dir=/usr/lib/x86_64-linux-gnu/gstreamer-1.0
          appimage=""
          for candidate in src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage; do
            [[ -f "$candidate" ]] && appimage="$candidate"
          done
          if [[ -z "$appimage" ]]; then
            echo "::error::No AppImage was produced."
            exit 1
          fi
          missing=()
          for element in libgstvideo4linux2.so libgstpipewire.so; do
            [[ -f "$dir/$element" ]] || missing+=("$element")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Capture plugins missing from the build machine, so the AppImage cannot see a camera: ${missing[*]}"
            exit 1
          fi
          # Confirm they really ended up inside the bundle, not just on the runner.
          # `--appimage-extract` writes `squashfs-root` into the current directory;
          # running it from the repo root keeps the paths below predictable, and
          # `./` keeps the image's own self-path resolution working.
          ./"$appimage" --appimage-extract 'usr/lib/gstreamer-1.0/*' >/dev/null
          for element in libgstvideo4linux2.so libgstpipewire.so; do
            if [[ ! -f "squashfs-root/usr/lib/gstreamer-1.0/$element" ]]; then
              echo "::error::$element was not bundled into the AppImage."
              exit 1
            fi
          done
          rm -rf squashfs-root
          echo "AppImage contains the v4l2 and PipeWire capture plugins."

      - name: Normalise artifact names
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          [[ -d "$bundle_dir" ]] || bundle_dir="src-tauri/target/release/bundle"
          mkdir -p renamed
          ext_of() { case "$1" in *.tar.gz) echo "app.tar.gz";; *) echo "${1##*.}";; esac; }
          while IFS= read -r -d '' f; do
            ext=$(ext_of "$f")
            cp "$f" "renamed/LightPen_${VERSION}_${{ matrix.name }}.${ext}"
          done < <(find "$bundle_dir" -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -print0 2>/dev/null)
          ls -l renamed || true

      - name: Normalise artifact names (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/${{ matrix.target }}/release/bundle"
          if (-not (Test-Path $bundleDir)) { $bundleDir = "src-tauri/target/release/bundle" }
          New-Item -ItemType Directory -Force -Path renamed | Out-Null
          Get-ChildItem -Path $bundleDir -Recurse -File -Include *.msi,*.exe |
            ForEach-Object { Copy-Item $_.FullName "renamed/LightPen_${env:VERSION}_${{ matrix.name }}.$($_.Extension.TrimStart('.'))" }
          Get-ChildItem renamed

      - name: Upload renamed artifacts
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" renamed/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload renamed artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # `env:` values are environment variables in PowerShell, so they must be
        # read as $env:TAG — a bare $TAG is an unset PS variable (empty string).
        run: |
          $files = Get-ChildItem -Path renamed -File | ForEach-Object { $_.FullName }
          if (-not $files) { throw "no artifacts were produced to upload" }
          gh release upload "$env:TAG" @files --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Job summary
        shell: bash
        # APPLE_CERTIFICATE / WINDOWS_CERTIFICATE were exported by
        # `prepare optional signing` only when a real value exists, so an empty
        # value here genuinely means "not configured".
        run: |
          {
            echo "### Desktop — ${{ matrix.name }}"
            echo ""
            # A single `case` decides everything: `[[ "${{ matrix.os }}" == macos-* ]]
            # would be rejected by shellcheck (SC2193), because actionlint replaces
            # the expression with underscores and the pattern can then never match.
            signable=false
            case "${{ matrix.os }}" in
              macos-*) signed="${APPLE_CERTIFICATE:-}" ; signable=true ;;
              windows-*) signed="${WINDOWS_CERTIFICATE:-}" ; signable=true ;;
              *) echo "✅ Linux bundles are not code-signed (not applicable)." ; signed="" ;;
            esac
            if [[ "$signable" == "true" ]]; then
              if [[ -z "$signed" ]]; then
                echo "⚠️ No code-signing certificate configured — this artifact is **unsigned**."
              else
                echo "✅ Signed (and notarised when Apple credentials were present)."
              fi
            fi
            echo ""
            ls -l renamed 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- android ---
  build-android:
    name: Android
    needs: prepare
    if: inputs.build_android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android NDK
        env:
          # Pinned: the NDK is a build toolchain, not a library — a silent major
          # bump changes clang/linker behaviour. r27 is what Tauri 2 targets.
          NDK_VERSION: 27.0.12077973
        run: |
          set -euo pipefail
          # No `yes |`: setup-android already accepts the licences
          # (accept-android-sdk-licenses defaults to true) and pipes nothing to
          # stdin. The old `yes | sdkmanager ... > /dev/null` killed `yes` with
          # SIGPIPE -> "standard output: Broken pipe" under `pipefail`.
          sdkmanager --install "ndk;$NDK_VERSION"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK_DIR" ]]; then
            echo "::error::NDK not found at $NDK_DIR after installation"
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Download hand-tracking model
        run: npm run fetch:model

      - name: Initialise Android project
        run: npm run tauri android init --ci

      - name: Grant the WebView camera permission
        # A WebView refuses getUserMedia() unless the activity grants the
        # PermissionRequest; appends the manifest entries and inserts the
        # MainActivity override in the freshly generated project.
        run: npm run android:permissions

      - name: Configure Android signing (release builds)
        # Must run *after* `android init`, which creates gen/android, and it edits
        # the generated Gradle build: per the Tauri docs the properties file is
        # gen/android/keystore.properties and app/build.gradle.kts needs a
        # `release` signingConfig, otherwise Gradle emits an UNSIGNED release APK
        # — and Android refuses to install those ("package appears to be
        # invalid"), which is exactly what shipped in v0.1.4.
        #
        # No secrets is NOT a reason to ship an unsigned release build: we then
        # build a debug APK instead, which Gradle signs with the debug key. So
        # every APK we upload is signed, and the signature is checked below.
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEY_BASE64:-}" ]]; then
            echo "::notice::No ANDROID_KEY_BASE64 secret — building a debug-signed APK for testing."
            echo "ANDROID_BUILD_KIND=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/android-keys"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/android-keys/release.keystore"
          # The upload key password and the store password are often different;
          # the template's Gradle config uses one value for both, so fall back.
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-keys/release.keystore"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          npm run android:signing
          echo "ANDROID_BUILD_KIND=release" >> "$GITHUB_ENV"

      - name: Build signed APK (release) or debug APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # A release build without a signingConfig produces an unsigned APK that
          # Android rejects at install time, so the fallback is a debug build
          # (always signed by Gradle), clearly named `_debug` below.
          if [[ "$ANDROID_BUILD_KIND" == "release" ]]; then
            npm run tauri android build -- --apk --aab
          else
            npm run tauri android build -- --debug --apk
          fi

          mkdir -p dist-android
          mapfile -t apks < <(find src-tauri/gen/android -name "*.apk")
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi

          if [[ "$ANDROID_BUILD_KIND" == "release" ]]; then
            cp "${apks[0]}" "dist-android/LightPen_${VERSION}_android_universal.apk"
            mapfile -t aabs < <(find src-tauri/gen/android -name "*.aab")
            if (( ${#aabs[@]} != 1 )); then
              echo "::error::Expected exactly one AAB, found ${#aabs[@]}: ${aabs[*]}"
              exit 1
            fi
            cp "${aabs[0]}" "dist-android/LightPen_${VERSION}_android_universal.aab"
          else
            cp "${apks[0]}" "dist-android/LightPen_${VERSION}_android_universal_debug.apk"
          fi
          ls -l dist-android

      - name: Verify the APK signature
        # The gate that v0.1.4 lacked: an unsigned APK is uninstallable, so never
        # publish one. `apksigner verify` fails on unsigned input and prints the
        # signer certificate, which also catches "signed with the wrong key".
        run: |
          set -euo pipefail
          # Gradle installs build-tools on demand, so apksigner may only appear
          # once the build above has run — hence this step sits after it.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            sdkmanager --install "build-tools;35.0.0" > /dev/null
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi
          echo "Using $APKSIGNER"
          for apk in dist-android/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | tee apksigner.txt
            DN="$(grep -m1 'certificate DN' apksigner.txt || true)"
            if [[ -z "$DN" ]]; then
              echo "::error::$apk has no signer certificate — it would not install."
              exit 1
            fi
            if [[ "$ANDROID_BUILD_KIND" == "release" && "$DN" == *"Android Debug"* ]]; then
              echo "::error::$apk is signed with the DEBUG key, not the release keystore."
              exit 1
            fi
            echo "✅ $apk is signed: $DN"
          done

      - name: Upload Android artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist-android/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        run: |
          {
            echo "### Android"
            echo ""
            if [[ "$ANDROID_BUILD_KIND" == "release" ]]; then
              echo "✅ Release-signed with the configured keystore (\`ANDROID_KEY_BASE64\`)."
              echo ""
              echo "Install \`LightPen_*_android_universal.apk\`; the \`.aab\` is for Play."
            else
              echo "⚠️ **Debug-signed test APK** — no \`ANDROID_KEY_BASE64\` secret."
              echo ""
              echo "Install \`LightPen_*_android_universal_debug.apk\`. It is signed with"
              echo "Gradle's debug key, so it installs, but it is a testing build: no"
              echo "release key, no Play upload, and a future release-signed build must"
              echo "be uninstalled before installing its first time."
            fi
            echo ""
            echo "Signature check: \`apksigner verify\` passed for every uploaded APK."
            echo ""
            ls -l dist-android 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ ios ---
  build-ios:
    name: iOS
    needs: prepare
    if: inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # Export needs BOTH halves: a certificate for codesigning and the App Store
      # Connect API key for -exportArchive. tauri derives whether to sign from
      # these, and a *partial* set is a hard error in the CLI, so the flag has to
      # match what we actually pass down.
      HAS_IOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: npm ci
      - name: Download hand-tracking model
        run: npm run fetch:model

      - name: Import Apple signing certificate (optional)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Unquoted on purpose: each existing keychain must become its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Write App Store Connect API key (optional)
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          # The filename is what Xcode looks for, so the key id must be in it.
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Initialise iOS project
        run: npm run tauri ios init --ci

      - name: Build iOS
        env:
          # Empty when unsigning, for the same all-or-nothing reason as above:
          # APPLE_API_KEY_ID/ISSUER/KEY_PATH set with an empty CERTIFICATE used to
          # reach the CLI as a partial credential set and abort the build with
          # "APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_PATH must be
          # provided for code signing".
          APPLE_TEAM_ID: ${{ env.HAS_IOS_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ env.HAS_IOS_SIGNING == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_ID: ${{ env.HAS_IOS_SIGNING == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_KEY_PATH: ${{ env.HAS_IOS_SIGNING == 'true' && format('{0}/private_keys/AuthKey_{1}.p8', runner.temp, secrets.APPLE_API_KEY_ID) || '' }}
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ "$HAS_IOS_SIGNING" == "true" ]]; then
            npm run tauri ios build -- --export-method app-store-connect
          else
            echo "::warning::No Apple signing secrets — building an UNSIGNED iOS app."
            # --no-sign still archives, and the CLI then exports a raw .app bundle
            # (there is no .ipa without an export step). Collect whichever exists.
            # `--` is required: without it npm treats `--no-sign` as its own
            # config flag and the CLI never sees it.
            npm run tauri -- ios build --no-sign
          fi
          mkdir -p dist-ios
          VERSION=${{ needs.prepare.outputs.version }}
          find src-tauri/gen/apple -name "*.ipa" -exec cp {} "dist-ios/LightPen_${VERSION}_ios_arm64.ipa" \; || true
          app_bundle=$(find src-tauri/gen/apple -name "*.app" -type d | head -1)
          if [[ -n "$app_bundle" ]]; then
            tar -czf "dist-ios/LightPen_${VERSION}_ios_arm64.app.tar.gz" \
              -C "$(dirname "$app_bundle")" "$(basename "$app_bundle")"
          fi
          if [[ -z "$(ls -A dist-ios)" ]]; then
            echo "::error::the iOS build produced no .ipa and no .app"
            exit 1
          fi
          ls -l dist-ios

      - name: Upload iOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist-ios/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        run: |
          {
            echo "### iOS"
            echo ""
            if [[ "$HAS_IOS_SIGNING" == "true" ]]; then
              echo "✅ Signed .ipa built."
            else
              echo "⚠️ **Unsigned build** — no Apple signing secrets. Not installable on devices; testing only."
            fi
            echo ""
            ls -l dist-ios 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- verify ---
  verify:
    name: Verify assets and checksums
    needs: [prepare, build-desktop, build-android, build-ios]
    # Run even when a platform job failed, so the summary explains what is missing.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Collect release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_IOS: ${{ inputs.build_ios }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt

          # Every optional platform must be gated on the SAME workflow input that
          # decides whether its job/row runs. macOS is opt-in, so expecting it
          # unconditionally failed the verify step of a correct release.
          expected=(
            "LightPen_${VERSION}_windows-x64"
            "LightPen_${VERSION}_windows-arm64"
            "LightPen_${VERSION}_linux-x64"
          )
          [[ "$BUILD_MACOS" == "true" ]] && expected+=("LightPen_${VERSION}_macos-universal")
          # Matched as a prefix, so both `..._android_universal.apk`/`.aab`
          # (release-signed) and `..._android_universal_debug.apk` (no keystore
          # secret) satisfy it. The Android job verifies the APK signature
          # before uploading; an unsigned APK never reaches the release.
          [[ "$BUILD_ANDROID" == "true" ]] && expected+=("LightPen_${VERSION}_android_universal")
          [[ "$BUILD_IOS" == "true" ]] && expected+=("LightPen_${VERSION}_ios_arm64")

          missing=()
          for want in "${expected[@]}"; do
            if ! grep -q -- "$want" assets.txt; then missing+=("$want"); fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing expected artifacts: ${missing[*]}"
            {
              echo "## Release verification FAILED"
              echo ""
              echo "Missing: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All expected artifacts are present."

          # Names this workflow can produce. Anything else is either a stale asset
          # from an older run or a bundle uploaded under Tauri's default name (which
          # `tauri-action` does whenever it is handed a `releaseId`). Warning only:
          # old drafts are reused, so failing here would be a permanent trap.
          unexpected=()
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            [[ "$asset" == "SHA256SUMS.txt" ]] && continue
            if [[ ! "$asset" =~ ^LightPen_[0-9]+\.[0-9]+\.[0-9]+_(windows-x64|windows-arm64|linux-x64|macos-universal|android_universal(_debug)?|ios_arm64)\.[A-Za-z0-9.]+$ ]]; then
              unexpected+=("$asset")
            fi
          done < assets.txt
          if (( ${#unexpected[@]} > 0 )); then
            echo "::warning::Unexpected release assets (not part of the naming scheme): ${unexpected[*]}"
          fi

      - name: Generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern "*" --clobber
          cd release-assets
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          files=()
          for f in *; do
            [[ "$f" == "SHA256SUMS.txt" ]] && continue
            [[ -f "$f" ]] || continue
            files+=("$f")
          done
          if (( ${#files[@]} == 0 )); then
            echo "::error::No assets to checksum."
            exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Job summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, (.size|tostring)] | @tsv' > listing.tsv || true
          {
            echo "## LightPen $TAG"
            echo ""
            echo "| Asset | Size (bytes) | Status |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r name size; do
              [[ -z "$name" ]] && continue
              echo "| \`$name\` | $size | ✅ uploaded |"
            done < listing.tsv
            echo ""
            echo "Build matrix: desktop (Windows x64/arm64, macOS universal, Linux x64), Android, iOS."
            echo "Platform job results: desktop=${{ needs.build-desktop.result }}, android=${{ needs.build-android.result }}, ios=${{ needs.build-ios.result }}."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- publish ---
  publish:
    name: Publish release
    needs: [prepare, build-desktop, verify]
    if: always() && inputs.draft == false && needs.verify.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          PRE_FLAG=""
          [[ "$PRERELEASE" == "true" ]] && PRE_FLAG="--prerelease"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest $PRE_FLAG
          echo "Published $TAG." >> "$GITHUB_STEP_SUMMARY"
